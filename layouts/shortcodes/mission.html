<style>
/* Mission Section Styles */
:root {
  --quote-border-color: #2D4366;
}

:root .dark {
  --quote-border-color: #4ecdc4;
}

.mission-container {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3rem;
  margin: 0 auto 3em auto;
  max-width: 1150px;
}

.quote-block {
  position: relative;
  padding: 3em;
  flex: 1.5;
  min-width: 300px;
  font-family: Georgia, serif;
  font-size: 1.2em;
  line-height: 1.7;
}

.quote-block::before,
.quote-block::after {
  position: absolute;
  width: 40px;
  height: 30px;
  border: 8px solid;
  border-color: var(--quote-border-color);
  content: "";
}

.quote-block::before {
  top: 0;
  left: 0;
  border-right: none;
  border-bottom: none;
}

.quote-block::after {
  bottom: 0;
  right: 0;
  border-left: none;
  border-top: none;
}

.mission-media-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1.5rem;
}

.mission-image-stack {
  position: relative;
  width: 100%;
  max-width: 350px;
  aspect-ratio: 1 / 1;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 30px rgba(0,0,0,0.15);
  background-color: var(--theme);
}

.mission-img-item {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.5s ease;
  margin: 0 !important;
  padding: 0 !important;
}

.mission-img-item.active {
  opacity: 1;
  visibility: visible;
  z-index: 2;
}

.mission-img-item a {
  display: block;
  width: 100%;
  height: 100%;
  margin: 0 !important;
  padding: 0 !important;
  text-decoration: none !important;
  border: none !important;
}

.mission-img-item img {
  width: 100% !important;
  height: 100% !important;
  display: block !important;
  object-fit: cover !important;
  margin: 0 !important;
  padding: 0 !important;
  border: none !important;
  transition: transform 0.3s ease;
}

.mission-img-item img:hover {
  transform: scale(1.03);
}

.mission-nav-dots {
  display: flex;
  flex-direction: column;
  gap: 15px;
  padding: 10px 0;
  flex-shrink: 0;
}

.nav-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background-color: #333;
  cursor: pointer;
  transition: background-color 0.3s ease;
  border: 1px solid rgba(0,0,0,0.1);
  box-sizing: border-box;
  position: relative;
}

/* Custom cursor on hover: Pacman with red exclamation mark */
.nav-dot:hover {
  cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><path d="M12 12 L21 6 A10 10 0 1 0 21 18 Z" fill="%23fff43c" stroke="black" stroke-width="1"/><circle cx="12" cy="6" r="1.5" fill="black"/><path d="M18 1 L20 1 L20 7 L18 7 Z M18 9 L20 9 L20 11 L18 11 Z" fill="red" stroke="white" stroke-width="0.5"/></svg>') 2 12, pointer;
}

.nav-dot::before {
  content: "";
  position: absolute;
  top: -10px;
  left: -10px;
  right: -10px;
  bottom: -10px;
}

.nav-dot.active {
  background-color: #fff43c !important;
}

.dark .nav-dot {
  background-color: #888;
}

.dark .nav-dot.active {
  background-color: #fff43c !important;
}

@media screen and (max-width: 850px) {
  .mission-container {
    flex-direction: column;
    text-align: center;
  }
  
  .mission-media-area {
    width: 100%;
    justify-content: center;
  }
}
</style>

<div class="mission-container">
    <div class="quote-block">
        {{ .Inner | markdownify }}
    </div>
    
    <div class="mission-media-area">
        <div class="mission-image-stack">
            {{ if .Get "image" }}
            <div class="mission-img-item active" data-index="0">
                {{ if .Get "link" }}<a href="{{ .Get "link" }}" target="_blank">{{ end }}
                <img src="{{ .Get "image" | relURL }}" alt="Mission Image 1">
                {{ if .Get "link" }}</a>{{ end }}
            </div>
            {{ end }}
            
            {{ if .Get "image2" }}
            <div class="mission-img-item" data-index="1">
                {{ if .Get "link2" }}<a href="{{ .Get "link2" }}" target="_blank">{{ end }}
                <img src="{{ .Get "image2" | relURL }}" alt="Mission Image 2">
                {{ if .Get "link2" }}</a>{{ end }}
            </div>
            {{ end }}
        </div>

        {{ if .Get "image2" }}
        <div class="mission-nav-dots">
            <div class="nav-dot active" data-index="0" onclick="switchMissionImage(this, 0)"></div>
            <div class="nav-dot" data-index="1" onclick="switchMissionImage(this, 1)"></div>
        </div>
        {{ end }}
    </div>
</div>

<script>
window.switchMissionImage = function(dotElement, index) {
    if (window.event) window.event.stopPropagation();
    const container = dotElement.closest('.mission-container');
    if (!container) return;
    
    const dots = container.querySelectorAll('.nav-dot');
    const items = container.querySelectorAll('.mission-img-item');
    
    dots.forEach((dot, i) => {
        if (i === index) dot.classList.add('active');
        else dot.classList.remove('active');
    });
    
    items.forEach((item, i) => {
        if (i === index) {
            item.classList.add('active');
        } else {
            item.classList.remove('active');
        }
    });
};
</script>
