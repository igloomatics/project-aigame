<div class="news-section">
    {{ .Inner }}
</div>

<style>
.news-section {
    margin: 2rem 0;
    border-left: 2px solid #eee; /* Vertical line on the left */
    padding-left: 1.5rem;
}

.news-entry {
    display: flex;
    flex-direction: column;
    margin-bottom: 1.5rem;
    position: relative;
}

/* Dot on the vertical line */
.news-entry::before {
    content: "";
    position: absolute;
    left: -1.85rem; /* Adjust based on padding-left of .news-section */
    top: 0.4rem;
    width: 0.6rem;
    height: 0.6rem;
    background-color: #ccc;
    border-radius: 50%;
    border: 2px solid #fff; /* White border to separate from the line */
}

.news-header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 0.2rem;
}

.news-title {
    font-size: 1.1rem;
    font-weight: bold;
    color: inherit;
    text-decoration: none;
    /* border-bottom: 1px dashed #999; */
    padding-bottom: 2px;
}

.news-title:hover {
    color: var(--primary);
    /* border-bottom-color: var(--primary); */
    text-decoration: underline;
}

.news-date {
    font-size: 0.85rem; /* Smaller font size */
    color: #666;
    white-space: nowrap;
    /* font-family: 'Courier New', Courier, monospace; */
}

.news-text {
    font-size: 1rem;
    color: #333;
}

/* Dark mode adjustments */
@media (prefers-color-scheme: dark) {
    .news-section {
        border-left-color: #444;
    }
    .news-entry::before {
        background-color: #666;
        border-color: #1d1e20;
    }
    .news-title {
        border-bottom-color: #666;
    }
    .news-date {
        color: #aaa;
    }
    .news-text {
        color: #ddd;
    }
}
</style>
