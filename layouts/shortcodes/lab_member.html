<head>
    <!-- Other head elements -->
    <style>
        .lab-member img,
        .lab-member h3,
        .lab-member p,
        .lab-member .social-links {
            margin-top: 0;
            margin-bottom: 0px;
        }
        .lab-member h3 {
            font-size: 1.25rem;
            margin-top: 10px;
        }
        .lab-member p, .lab-member .social-links {
            font-size: 1.0rem;
        }
        .lab-member {
            display: grid;
            justify-items: center;
            text-align: center;
        }

        /* Flip Animation Styles */
        .flip-container {
            perspective: 1000px;
            width: 100%;
            aspect-ratio: 1 / 1;
            margin-bottom: 10px;
        }

        .flip-card {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .lab-member:hover .flip-card {
            transform: rotateY(180deg);
        }

        .flip-front, .flip-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 50%;
            overflow: hidden;
        }

        .flip-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .flip-back {
            background-color: var(--tertiary);
            color: var(--primary);
            transform: rotateY(180deg);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
        }

        .flip-back a {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none !important;
            color: inherit;
            outline: none !important;
            box-shadow: none !important;
            border-bottom: none !important;
        }

        .flip-back a * {
            text-decoration: none !important;
            outline: none !important;
        }

        .flip-back i {
            font-size: 2rem;
            margin-bottom: 4px;
        }

        .flip-back span {
            font-size: 0.8rem;
            font-weight: bold;
        }

        .no-link-back {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
    <!-- Include Font Awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<div class="lab-member">
    <div class="flip-container">
        <div class="flip-card">
            <div class="flip-front">
                <img src="{{ printf "img/members/%s" (.Get "image") | relURL }}" alt="{{ .Get "name" }}" class="lab-member-img">
            </div>
            <div class="flip-back">
                {{ if .Get "academic" }}
                <a href="{{ .Get "academic" }}" target="_blank" rel="noopener noreferrer">
                    <i class="fas fa-home"></i>
                    <span>Homepage</span>
                </a>
                {{ else }}
                <div class="no-link-back">
                    <i class="fas fa-user"></i>
                    <span>{{ .Get "name" }}</span>
                </div>
                {{ end }}
            </div>
        </div>
    </div>
    <h3>{{ .Get "name" }}</h3>
    <p>{{ .Get "role" }}</p>
    <div class="social-links">
        {{ if .Get "twitter" }}
        <a href="{{ .Get "twitter" }}"><i class="fab fa-x-twitter"></i></a>
        {{ end }}
        {{ if .Get "linkedin" }}
            <a href="{{ .Get "linkedin" }}"><i class="fab fa-linkedin"></i></a>
        {{ end }}
    </div>
</div>
